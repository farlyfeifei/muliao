<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
    <radialGradient id="mbg" cx="0.5" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#080b10"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#mbg)"/>
  <!-- 外环：层层校验（带缺口，错开旋转，呈推演感） -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#mg)" stroke-width="3.4"
          stroke-linecap="round" stroke-dasharray="104 40" transform="rotate(-58 32 32)" opacity="0.92"/>
  <!-- 内环 -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#mg)" stroke-width="2.8"
          stroke-linecap="round" stroke-dasharray="58 30" transform="rotate(142 32 32)" opacity="0.7"/>
  <!-- 扫描指针 -->
  <line x1="32" y1="32" x2="32" y2="12" stroke="#ffd9a0" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <!-- 中心：落定的判断 -->
  <circle cx="32" cy="32" r="5.2" fill="url(#mg)"/>
  <circle cx="32" cy="32" r="5.2" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.35"/>
</svg>
